<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Arşivi - Rxalign</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .search-container {
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .form-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .form-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        .form-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-badge {
            font-size: 20px;
            line-height: 1;
        }
        
        .status-checked-in {
            color: #10b981;
        }
        
        .status-not-checked-in {
            color: #ef4444;
        }
        
        .form-card p {
            color: #666;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .form-card .date {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .form-card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-view {
            background: #667eea;
            color: white;
        }
        
        .btn-view:hover {
            background: #5568d3;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
        }
        
        .btn-delete:hover {
            background: #dc2626;
        }
        
        .btn-undo-checkin {
            background: #f97316;
            color: white;
        }

        .btn-undo-checkin:hover {
            background: #ea580c;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        /* Şifre modalı (asistan arşivinden hekim düzenlemesi) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal-subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm {
            background: #667eea;
            color: white;
        }

        .btn-confirm:hover {
            background: #5568d3;
        }

        .btn-cancel {
            background: #ddd;
            color: #666;
        }

        .btn-cancel:hover {
            background: #ccc;
        }

        .error-message {
            color: #f5576c;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: #5568d3;
        }
        
        .version-info {
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: white !important;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Form Arşivi</h1>
            <p class="subtitle">Invisalign Tedavi Formları</p>
        </header>

        <main>
            <a href="index.html" class="back-btn">← Ana Sayfa</a>
            
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Hasta adı veya soyadı ile ara..."
                    onkeyup="searchForms()"
                >
                <p style="color: #666; font-size: 14px;">Toplam: <span id="totalCount">0</span> form</p>
            </div>
            
            <div id="loadingDiv" class="loading">
                <p>Formlar yükleniyor...</p>
            </div>
            
            <div id="formsGrid" class="forms-grid"></div>
            
            <div id="noResults" class="no-results" style="display: none;">
                <p>Henüz kaydedilmiş form bulunmuyor.</p>
            </div>
        </main>
    </div>
    
    <div class="version-info">
        Copyright © 2026 <span id="appVersion">v2</span>
    </div>

    <!-- Şifre Modal: asistan arşivinden formu düzenlemek için hekim şifresi -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h2 class="modal-title">Hekim Girişi</h2>
            <p class="modal-subtitle" id="passwordSubtitle">Formu düzenlemek için hekim şifresini girin</p>
            <input type="password" id="passwordInput" class="modal-input" placeholder="Şifre giriniz" autocomplete="off" onkeydown="if(event.key === 'Enter') checkPassword()">
            <p class="error-message" id="errorMessage">Hatalı şifre! Lütfen tekrar deneyin.</p>
            <div class="modal-buttons">
                <button class="modal-button btn-cancel" onclick="closePasswordModal()">İptal</button>
                <button class="modal-button btn-confirm" onclick="checkPassword()">Giriş</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        let allForms = [];
        let userRole = 'assistant'; // varsayılan: asistan
        
        // URL'den role parametresini al
        function getUserRole() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('role') || 'assistant';
        }
        
        // Formları yükle
        async function loadForms() {
            // Kullanıcı rolünü belirle
            userRole = getUserRole();
            
            if (!db) {
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Firebase bağlantısı kurulamadı!</p>';
                return;
            }
            
            try {
                const snapshot = await db.collection('invisalign_forms')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                allForms = [];
                snapshot.forEach(doc => {
                    allForms.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('totalCount').textContent = allForms.length;
                
                if (allForms.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                } else {
                    displayForms(allForms);
                }
            } catch (error) {
                console.error('Formları yükleme hatası:', error);
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Formlar yüklenemedi: ' + error.message + '</p>';
            }
        }
        
        // Formları görüntüle
        function displayForms(forms) {
            const grid = document.getElementById('formsGrid');
            grid.innerHTML = '';
            
            if (forms.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }
            
            document.getElementById('noResults').style.display = 'none';
            
            forms.forEach(form => {
                const card = document.createElement('div');
                card.className = 'form-card';
                
                const date = form.createdAt ? new Date(form.createdAt.seconds * 1000).toLocaleDateString('tr-TR') : 'Tarih yok';
                const hastaAdi = form.hasta_adi || '-';
                const hastaSoyadi = form.hasta_soyadi || '-';
                const hastaMI = form.hasta_mi || '';
                const hastaTipi = form.hasta_tipi || '-';
                const formTuru = form.form_turu === 'refinement' ? '🔄 Refinement' : (form.form_turu === 'yeni_hasta_flex' ? '⚡ Flex Rx' : '📋 Yeni Hasta');
                
                // Tedavi paketini bul - farklı name'lerden herhangi biri olabilir
                const tedaviPaketi = form.tedavi_secenegi || 
                                     form.tedavi_secenegi_ergen || 
                                     form.tedavi_secenegi_vivera || 
                                     form.tedavi_secenegi_gulumseme ||
                                     form.tedavi_secenegi_ergen_vivera ||
                                     form.tedavi_secenegi_palatal ||
                                     form.tedavi_secenegi_cocuk_first ||
                                     form.tedavi_secenegi_cocuk_vivera ||
                                     form.tedavi_secenegi_cocuk_palatal ||
                                     '-';
                
                // Giriş durumu badge'i
                const checkedIn = form.checked_in || false;
                const statusBadge = checkedIn 
                    ? '<span class="status-badge status-checked-in" title="Giriş Yapıldı">✓</span>'
                    : '<span class="status-badge status-not-checked-in" title="Giriş Yapılmadı">✗</span>';
                
                // Hasta adı metin olarak yazılır (kesme işareti, < > gibi karakterler sorun çıkarmasın)
                const patientLabel = `${hastaSoyadi}, ${hastaAdi}`;

                // Silme butonu sadece hekim için görünür
                const deleteButton = userRole === 'doctor'
                    ? `<button class="btn-small btn-delete" data-action="delete">Sil</button>`
                    : '';

                // Giriş iptal butonu sadece hekim için ve giriş yapılmışsa görünür
                const undoCheckInButton = (userRole === 'doctor' && checkedIn)
                    ? `<button class="btn-small btn-undo-checkin" data-action="undo">Girişi İptal Et</button>`
                    : '';

                card.innerHTML = `
                    <h3>
                        ${statusBadge}
                        <span class="patient-name"></span>
                    </h3>
                    <p><strong>Form Türü:</strong> ${formTuru}</p>
                    <p><strong>Hasta Tipi:</strong> <span class="hasta-tipi"></span></p>
                    <p><strong>Tedavi Paketi:</strong> <span class="tedavi-paketi"></span></p>
                    <p class="date">Kayıt Tarihi: ${date}</p>
                    <div class="form-card-actions">
                        <button class="btn-small btn-view" data-action="view">Görüntüle</button>
                        <button class="btn-small btn-edit" data-action="edit">Düzenle</button>
                        ${deleteButton}
                        ${undoCheckInButton}
                    </div>
                `;
                card.querySelector('.patient-name').textContent = `${patientLabel} ${hastaMI}`.trim();
                card.querySelector('.hasta-tipi').textContent = hastaTipi;
                card.querySelector('.tedavi-paketi').textContent = tedaviPaketi;

                card.querySelector('[data-action="view"]').addEventListener('click', () => viewForm(form.id));
                card.querySelector('[data-action="edit"]').addEventListener('click', () => editForm(form.id, patientLabel));
                card.querySelector('[data-action="delete"]')?.addEventListener('click', () => deleteForm(form.id, patientLabel));
                card.querySelector('[data-action="undo"]')?.addEventListener('click', () => undoCheckIn(form.id, patientLabel));

                grid.appendChild(card);
            });
        }
        
        // Arama
        function searchForms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allForms.filter(form => {
                const hastaAdi = (form.hasta_adi || '').toLowerCase();
                const hastaSoyadi = (form.hasta_soyadi || '').toLowerCase();
                const fullName = `${hastaSoyadi} ${hastaAdi}`;
                
                return fullName.includes(searchTerm);
            });
            
            displayForms(filtered);
        }
        
        // Form görüntüle
        function viewForm(formId) {
            // form.html'e yönlendir (ID ve role ile)
            window.location.href = `form.html?view=${formId}&role=${userRole}`;
        }

        // ---- Düzenleme: hekim doğrudan, asistan hekim şifresiyle ----
        const DOCTOR_PASSWORD = '1234';
        let pendingEditFormId = null;

        function openEditMode(formId) {
            // Hekim arşivine geçer ve kartı değişiklik yapılır modda açar
            window.location.href = `form.html?view=${formId}&role=doctor&edit=true`;
        }

        function editForm(formId, patientName) {
            if (userRole === 'doctor') {
                openEditMode(formId);
                return;
            }
            pendingEditFormId = formId;
            document.getElementById('passwordSubtitle').textContent =
                `"${patientName}" formunu düzenlemek için hekim şifresini girin`;
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').focus();
        }

        function closePasswordModal() {
            pendingEditFormId = null;
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').classList.remove('show');
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            if (input.value === DOCTOR_PASSWORD) {
                const formId = pendingEditFormId;
                closePasswordModal();
                if (formId) openEditMode(formId);
            } else {
                document.getElementById('errorMessage').classList.add('show');
                input.value = '';
                input.focus();
            }
        }

        // Modal dışına tıklayınca kapat
        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) closePasswordModal();
        });
        
        // Form sil
        async function deleteForm(formId, patientName) {
            if (!confirm(`"${patientName}" adlı hastanın formunu silmek istediğinizden emin misiniz?`)) {
                return;
            }
            
            try {
                await db.collection('invisalign_forms').doc(formId).delete();
                alert('Form başarıyla silindi!');
                loadForms(); // Listeyi yenile
            } catch (error) {
                console.error('Form silme hatası:', error);
                alert('Form silinemedi: ' + error.message);
            }
        }
        
        // Girişi iptal et
        async function undoCheckIn(formId, patientName) {
            if (!confirm(`"${patientName}" adlı hastanın girişini iptal etmek istediğinizden emin misiniz?`)) {
                return;
            }
            
            try {
                await db.collection('invisalign_forms').doc(formId).update({
                    checked_in: false,
                    checked_in_at: null
                });
                alert('Giriş işlemi başarıyla iptal edildi!');
                loadForms(); // Listeyi yenile
            } catch (error) {
                console.error('Giriş iptal hatası:', error);
                alert('Giriş iptal edilemedi: ' + error.message);
            }
        }
        
        // Sayfa yüklendiğinde formları getir
        document.addEventListener('DOMContentLoaded', loadForms);
        
        // ESC tuşuna basıldığında ana sayfaya dön
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                // Şifre penceresi açıksa önce onu kapat
                if (document.getElementById('passwordModal').classList.contains('active')) {
                    closePasswordModal();
                    return;
                }
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="version.js"></script>
</body>
</html>
