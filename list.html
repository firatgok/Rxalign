<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F6F5F1">
    <title>Form Arşivi - Rxalign</title>
    <script src="js/theme.js"></script>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="page-list">

    <header class="appbar">
        <a class="appbar-logo" href="index.html" aria-label="Rxalign ana sayfa"><img class="logo-full" src="images/rxalign-logo.png" alt="Rxalign"><img class="logo-mark" src="images/rxalign-mark.png" alt=""></a>
        <nav class="topnav" aria-label="Ana gezinme">
            <a href="#" aria-current="page">Arşiv</a>
            <a href="form.html" id="navNewForm" class="nav-new" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                <span>Yeni form</span>
            </a>
            <a href="settings.html" id="navSettings" class="nav-settings" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="8" cy="17" r="2.5"></circle></svg>
                <span class="nav-text-opt">Ayarlar</span>
            </a>
        </nav>
        <div class="appbar-actions">
            <nav class="icon-rail" aria-label="Hızlı erişim">
                <a class="rail-btn" href="index.html" title="Ana sayfa" aria-label="Ana sayfa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>
                    <span class="rail-label">Ana sayfa</span>
                </a>
                <a class="rail-btn" href="settings.html" title="Ayarlar" aria-label="Ayarlar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
                    <span class="rail-label">Ayarlar</span>
                </a>
                <button type="button" class="rail-btn theme-btn" data-theme-toggle aria-label="Gece moduna geç" title="Gece modu">
                    <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                    <span class="rail-label">Gece modu</span>
                </button>
            </nav>
            <span class="role-badge" id="roleBadge"><span class="avatar" id="roleAvatar"></span><span id="roleName"></span></span>
            <a class="btn btn-ghost btn-sm" href="index.html">Çıkış</a>
        </div>
    </header>

    <main class="list-main">
        <div class="list-head">
            <div>
                <h1 id="listTitle">Form arşivi</h1>
                <p id="listSubtitle">Yükleniyor…</p>
            </div>
            <a class="btn btn-accent btn-lg btn-new" href="form.html" id="newFormBtn" hidden>
                <span class="plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
                <span>Yeni form oluştur</span>
            </a>
        </div>

        <div class="list-tools">
            <div class="search-field">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <label class="sr-only" for="searchInput">Hasta ara</label>
                <input id="searchInput" type="search" placeholder="Hasta adı, soyadı veya MI ile ara" autocomplete="off">
            </div>
            <div class="seg" role="group" aria-label="Durum filtresi" id="statusSeg">
                <button type="button" data-status="all" aria-pressed="true">Tümü <span class="n" id="cntAll">0</span></button>
                <button type="button" data-status="pending" aria-pressed="false"><span class="dot" style="background: var(--warn-dot)"></span>Bekliyor <span class="n" id="cntPending">0</span></button>
                <button type="button" data-status="done" aria-pressed="false"><span class="dot" style="background: var(--ok-strong)"></span>Girildi <span class="n" id="cntDone">0</span></button>
            </div>
            <div class="type-chips" role="group" aria-label="Form türü filtresi" id="typeChips">
                <button type="button" class="filter-chip" data-type="yeni_hasta" aria-pressed="false">Yeni hasta</button>
                <button type="button" class="filter-chip" data-type="yeni_hasta_flex" aria-pressed="false">Flex Rx</button>
                <button type="button" class="filter-chip" data-type="refinement" aria-pressed="false">Refinement</button>
            </div>
            <label class="sort">
                <span>Sırala</span>
                <select id="sortSelect">
                    <option value="newest">Yeniden eskiye</option>
                    <option value="oldest">Eskiden yeniye</option>
                    <option value="name">Hasta soyadı A–Z</option>
                </select>
            </label>
        </div>

        <div class="list-table-wrap">
            <div class="list-scroll">
                <table class="list-table">
                    <thead>
                        <tr>
                            <th scope="col">Durum</th>
                            <th scope="col">Hasta</th>
                            <th scope="col">Form türü</th>
                            <th scope="col">Hasta tipi</th>
                            <th scope="col">Paket</th>
                            <th scope="col">Kayıt</th>
                            <th scope="col">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="list-state" id="tableState">Formlar yükleniyor…</div>
            <div class="list-footer" id="tableFooter" hidden>
                <span id="footerInfo"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="moreBtn">Daha fazla göster</button>
            </div>
        </div>

        <div class="list-cards" id="cardList"></div>
        <div class="list-state mobile-only" id="cardState" hidden></div>
        <button type="button" class="btn btn-secondary btn-block mobile-only" id="moreBtnMobile" hidden>Daha fazla göster</button>
    </main>

    <a class="fab" href="form.html" id="fabNew" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Yeni form</span>
    </a>

    <div class="version-info">© 2026 Rxalign · <span id="appVersion">v2</span> · <a href="eski/index.html" data-legacy-link class="legacy-link">Eski tasarım</a></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const PAGE = 25;
            const params = new URLSearchParams(window.location.search);
            let userRole = params.get('role') === 'doctor' ? 'doctor' : 'assistant';
            let allForms = [];
            let status = 'all';
            let types = new Set();
            let sort = 'newest';
            let shown = PAGE;
            let openMenu = null;

            const $ = id => document.getElementById(id);
            const esc = RX.escapeHtml;

            // ---- Rol ----
            function applyRole() {
                const doctor = userRole === 'doctor';
                $('roleBadge').className = 'role-badge ' + (doctor ? 'doctor' : 'assistant');
                $('roleAvatar').textContent = doctor ? 'FG' : 'AS';
                $('roleName').textContent = doctor ? 'Hekim' : 'Asistan';
                ['navNewForm', 'navSettings', 'newFormBtn', 'fabNew'].forEach(id => { $(id).hidden = !doctor; });
                $('listTitle').textContent = doctor ? 'Form arşivi' : 'Giriş bekleyen formlar';
                if (!doctor) {
                    status = 'pending';
                    sort = 'oldest';
                    $('sortSelect').value = 'oldest';
                    $('statusSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.status === 'pending')));
                }
            }

            async function ensureRole() {
                if (userRole !== 'doctor' || RX.doctorRemembered()) return;
                const ok = await RX.askPin({ text: 'Hekim arşivi için 4 haneli PIN kodunu girin.' });
                if (!ok) {
                    userRole = 'assistant';
                    history.replaceState(null, '', 'list.html?role=assistant');
                }
            }

            // ---- Yükleme ----
            async function loadForms() {
                if (typeof db === 'undefined' || !db) {
                    setState('Firebase bağlantısı kurulamadı.', true);
                    return;
                }
                try {
                    const snapshot = await db.collection('invisalign_forms').orderBy('createdAt', 'desc').get();
                    allForms = [];
                    snapshot.forEach(doc => allForms.push({ id: doc.id, ...doc.data() }));
                    render();
                } catch (error) {
                    console.error('Formları yükleme hatası:', error);
                    setState('Formlar yüklenemedi: ' + error.message, true);
                }
            }

            function setState(text, isError) {
                [$('tableState'), $('cardState')].forEach(el => {
                    el.hidden = !text;
                    el.textContent = text || '';
                    el.classList.toggle('error', !!isError);
                });
            }

            // ---- Filtre / sıralama ----
            function filtered() {
                const q = $('searchInput').value.trim().toLowerCase();
                let list = allForms.filter(f => {
                    if (status === 'pending' && f.checked_in) return false;
                    if (status === 'done' && !f.checked_in) return false;
                    const type = f.form_turu || 'yeni_hasta';
                    if (types.size && !types.has(type)) return false;
                    if (q) {
                        const hay = `${f.hasta_soyadi || ''} ${f.hasta_adi || ''} ${f.hasta_mi || ''}`.toLowerCase();
                        if (!hay.includes(q)) return false;
                    }
                    return true;
                });
                const t = f => (f.createdAt && f.createdAt.seconds) || 0;
                if (sort === 'newest') list.sort((a, b) => t(b) - t(a));
                else if (sort === 'oldest') list.sort((a, b) => t(a) - t(b));
                else list.sort((a, b) => `${a.hasta_soyadi || ''} ${a.hasta_adi || ''}`.localeCompare(`${b.hasta_soyadi || ''} ${b.hasta_adi || ''}`, 'tr'));
                return list;
            }

            function statusPill(f) {
                return f.checked_in
                    ? '<span class="pill pill-done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 7"></path></svg>Girildi</span>'
                    : '<span class="pill pill-pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Bekliyor</span>';
            }

            function nameHtml(f) {
                const label = `${f.hasta_soyadi || '-'}, ${f.hasta_adi || '-'}`;
                return `<span class="name">${esc(label)}${f.hasta_mi ? ` <span class="mi">· ${esc(f.hasta_mi)}</span>` : ''}</span>`;
            }

            const MENU_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>';
            const EYE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            const ICONS = {
                edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z"></path><path d="M12.5 7.5l4 4"></path></svg>',
                undo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>',
                delete: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>'
            };

            function render() {
                closeMenu();
                const pending = allForms.filter(f => !f.checked_in).length;
                $('cntAll').textContent = allForms.length;
                $('cntPending').textContent = pending;
                $('cntDone').textContent = allForms.length - pending;
                $('listSubtitle').textContent = allForms.length
                    ? `${allForms.length} form · ${pending} tanesi IDS girişi bekliyor`
                    : 'Henüz kaydedilmiş form yok';

                const list = filtered();
                const page = list.slice(0, shown);
                const tbody = $('tableBody');
                const cards = $('cardList');
                tbody.innerHTML = '';
                cards.innerHTML = '';

                if (!allForms.length) { setState('Henüz kaydedilmiş form bulunmuyor.'); }
                else if (!list.length) { setState('Bu filtreyle eşleşen form yok.'); }
                else setState('');

                page.forEach(f => {
                    const type = RX.FORM_TURU[f.form_turu] || 'Yeni hasta';
                    const ht = RX.HASTA_TIPI[f.hasta_tipi] || f.hasta_tipi || '—';
                    const pkg = RX.packageOf(f) || '—';
                    const date = RX.formatDate(f.createdAt) || '—';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${statusPill(f)}</td>
                        <td>${nameHtml(f)}</td>
                        <td>${esc(type)}</td>
                        <td>${esc(ht)}</td>
                        <td>${esc(pkg)}</td>
                        <td class="date">${esc(date)}</td>
                        <td class="actions"><span class="row-actions">${actionsHtml(f, '')}</span></td>`;
                    bindActions(tr, f);
                    tbody.appendChild(tr);

                    const card = document.createElement('div');
                    card.className = 'list-card';
                    card.innerHTML = `
                        <div class="top">${nameHtml(f)}${statusPill(f)}</div>
                        <div class="meta"><span>${esc(type)}</span><span>·</span><span>${esc(ht)}</span><span>·</span><strong>${esc(pkg)}</strong></div>
                        <div class="bottom"><span>${esc(date)}</span><span class="card-actions">${actionsHtml(f, 'btn-sm')}</span></div>`;
                    bindActions(card, f);
                    cards.appendChild(card);
                });

                const more = list.length > shown;
                $('tableFooter').hidden = !list.length;
                $('footerInfo').textContent = `${Math.min(shown, list.length)} / ${list.length} gösteriliyor`;
                $('moreBtn').hidden = !more;
                $('moreBtnMobile').hidden = !more;
            }

            // Satır eylemleri: Görüntüle · Düzenle · (⋯ yalnızca giriş iptali varsa) · Sil (simge, en sonda)
            // Her iki rolde de üçü görünür; asistanda Düzenle ve Sil hekim PIN'i ister.
            function hasMenu(f) {
                return userRole === 'doctor' && !!f.checked_in;
            }
            function actionsHtml(f, size) {
                const menu = hasMenu(f)
                    ? `<button type="button" class="menu-btn" data-act="menu" aria-label="Diğer işlemler" aria-haspopup="menu">${MENU_ICON}</button>`
                    : '';
                return `<button type="button" class="btn btn-view ${size}" data-act="view">${EYE_ICON}<span>Görüntüle</span></button>` +
                    `<button type="button" class="btn btn-edit ${size}" data-act="edit">${ICONS.edit}<span>Düzenle</span></button>` +
                    menu +
                    `<button type="button" class="btn btn-delete btn-icon ${size}" data-act="delete" aria-label="Formu sil" title="Sil">${ICONS.delete}</button>`;
            }

            function bindActions(el, f) {
                const label = `${f.hasta_soyadi || '-'}, ${f.hasta_adi || '-'}`;
                el.querySelector('[data-act="view"]').addEventListener('click', () => viewForm(f.id));
                el.querySelector('[data-act="edit"]').addEventListener('click', () => editForm(f.id, label));
                el.querySelector('[data-act="delete"]').addEventListener('click', () => deleteForm(f.id, label));
                el.querySelector('[data-act="menu"]')?.addEventListener('click', e => { e.stopPropagation(); toggleMenu(e.currentTarget, f); });
            }

            // ---- Satır menüsü ----
            function closeMenu() {
                if (openMenu) { openMenu.remove(); openMenu = null; }
            }
            function toggleMenu(btn, f) {
                if (openMenu && openMenu._for === btn) { closeMenu(); return; }
                closeMenu();
                const label = `${f.hasta_soyadi || '-'}, ${f.hasta_adi || '-'}`;
                const menu = document.createElement('div');
                menu.className = 'row-menu';
                menu.setAttribute('role', 'menu');
                // Görüntüle, Düzenle ve Sil satırda; menüde yalnızca giriş iptali kalır (hekim, girilmiş form)
                const items = [['undo', 'Girişi iptal et', 'undo']];
                menu.innerHTML = items.map(([act, text, cls]) => `<button type="button" role="menuitem" class="mi mi-${cls}" data-act="${act}"><span class="mi-icon">${ICONS[cls]}</span><span>${text}</span></button>`).join('');
                menu.querySelector('[data-act="undo"]').addEventListener('click', () => { closeMenu(); undoCheckIn(f.id, label); });
                document.body.appendChild(menu);
                const r = btn.getBoundingClientRect();
                const w = menu.offsetWidth;
                menu.style.top = `${window.scrollY + r.bottom + 6}px`;
                menu.style.left = `${Math.max(8, window.scrollX + r.right - w)}px`;
                menu._for = btn;
                openMenu = menu;
            }
            document.addEventListener('click', closeMenu);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
            window.addEventListener('scroll', closeMenu, { passive: true });

            // ---- İşlemler ----
            function viewForm(id) {
                window.location.href = `form.html?view=${id}&role=${userRole}`;
            }
            async function editForm(id, label) {
                if (userRole !== 'doctor') {
                    const ok = await RX.askPin({ text: `"${label}" formunu düzenlemek için hekim PIN kodunu girin.`, rememberOption: false, grantSession: false });
                    if (!ok) return;
                }
                window.location.href = `form.html?view=${id}&role=doctor&edit=true`;
            }
            async function deleteForm(id, label) {
                if (userRole !== 'doctor') {
                    const ok = await RX.askPin({ title: 'Formu sil', text: `"${label}" formunu silmek için hekim PIN kodunu girin.`, rememberOption: false, grantSession: false });
                    if (!ok) return;
                }
                if (!confirm(`"${label}" adlı hastanın formunu silmek istediğinizden emin misiniz?`)) return;
                try {
                    await db.collection('invisalign_forms').doc(id).delete();
                    RX.toast(`Silindi: ${label}`);
                    loadForms();
                } catch (error) {
                    console.error('Form silme hatası:', error);
                    alert('Form silinemedi: ' + error.message);
                }
            }
            async function undoCheckIn(id, label) {
                if (!confirm(`"${label}" adlı hastanın girişini iptal etmek istediğinizden emin misiniz?`)) return;
                try {
                    await db.collection('invisalign_forms').doc(id).update({ checked_in: false, checked_in_at: null });
                    RX.toast(`Giriş iptal edildi: ${label}`);
                    loadForms();
                } catch (error) {
                    console.error('Giriş iptal hatası:', error);
                    alert('Giriş iptal edilemedi: ' + error.message);
                }
            }

            // ---- Olaylar ----
            $('searchInput').addEventListener('input', () => { shown = PAGE; render(); });
            $('statusSeg').addEventListener('click', e => {
                const b = e.target.closest('button[data-status]');
                if (!b) return;
                status = b.dataset.status;
                $('statusSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
                shown = PAGE;
                render();
            });
            $('typeChips').addEventListener('click', e => {
                const b = e.target.closest('button[data-type]');
                if (!b) return;
                const t = b.dataset.type;
                if (types.has(t)) types.delete(t); else types.add(t);
                b.setAttribute('aria-pressed', String(types.has(t)));
                shown = PAGE;
                render();
            });
            $('sortSelect').addEventListener('change', e => { sort = e.target.value; render(); });
            $('moreBtn').addEventListener('click', () => { shown += PAGE; render(); });
            $('moreBtnMobile').addEventListener('click', () => { shown += PAGE; render(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !document.getElementById('rxPinModal') && !openMenu) window.location.href = 'index.html';
            });
            document.addEventListener('keydown', e => {
                if (e.key === '/' && document.activeElement !== $('searchInput') && !document.getElementById('rxPinModal')) {
                    e.preventDefault();
                    $('searchInput').focus();
                }
            });

            document.addEventListener('DOMContentLoaded', async () => {
                await ensureRole();
                applyRole();
                loadForms();
            });
        })();
    </script>
    <script src="version.js"></script>
</body>
</html>
